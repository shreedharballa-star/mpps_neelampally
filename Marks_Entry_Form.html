<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Student Marks Entry Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        /* డబుల్ స్క్రోల్ బార్ రాకుండా బాడీని సరిచేయడం */
        body {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #8b5cf6 100%);
            color: var(--text-main);
            padding: 1.5rem 1rem;
            min-height: 100vh;
            height: auto;
            position: relative;
            overflow: hidden !important; /* ఇక్కడ స్క్రోల్ బార్ రాకుండా ఆపేస్తుంది */
        }

        body::before {
            content: "+ - × ÷ π √ ∑ + - × ÷ π √ ∑ % ∞";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 3rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.07);
            display: flex;
            flex-wrap: wrap;
            gap: 4rem;
            padding: 3rem;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            letter-spacing: 5rem;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            height: auto;
            overflow: visible !important;
        }
        
        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        select, input {
            padding: 0.75rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
            background-color: #ffffff;
            color: #0f172a;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: var(--text-muted);
            cursor: not-allowed;
            text-align: center;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 1.5rem 0 0.75rem 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.4rem;
            color: var(--primary);
        }

        .subjects-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .subjects-container {
                grid-template-columns: 1fr;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            table-layout: fixed;
        }

        th:nth-child(1), td:nth-child(1) { width: 44%; }
        th:nth-child(2), td:nth-child(2) { width: 28%; }
        th:nth-child(3), td:nth-child(3) { width: 28%; }

        th, td {
            padding: 0.65rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 600;
        }

        td input[type="number"], td input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            text-align: center;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        #loading {
            text-align: center;
            color: var(--text-muted);
            margin: 10px 0;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Marks Entry Form</h2>
    
    <form id="marksForm">
        <div class="form-grid">
            <div class="form-group">
                <label>1. Academic Year</label>
                <select id="academicYear" required onchange="onAcademicYearChange()">
                    <option value="">Loading years...</option>
                </select>
            </div>
            <div class="form-group">
                <label>2. Exam Type</label>
                <select id="examType" required onchange="onExamTypeChange()">
                    <option value="">Select Exam</option>
                </select>
            </div>
            <div class="form-group">
                <label>3. Class</label>
                <select id="classSelect" required onchange="onClassChange()">
                    <option value="">Select Class</option>
                </select>
            </div>
            <div class="form-group">
                <label>4. Student Name</label>
                <select id="studentSelect" required onchange="renderDynamicFields()">
                    <option value="">Select Student</option>
                </select>
            </div>
        </div>

        <div id="loading">Fetching data from Google Sheet...</div>

        <div id="dynamicContainer"></div>

        <button type="submit" class="btn-submit" id="submitBtn" style="display:none;">Submit Marks</button>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyv_8ZKwjeIfuPzZd3nlQr66EkkdWImrtgS-xk5rCdSwZ47Qoq-2sIE5ALpHKPqbyaN/exec"; 
    let studentsData = [];

    window.addEventListener('DOMContentLoaded', async function() {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=getFilters`);
            const result = await response.json();
            
            const yearSelect = document.getElementById('academicYear');
            const examSelect = document.getElementById('examType');
            const classSelect = document.getElementById('classSelect');
            
            yearSelect.innerHTML = '<option value="">Select Year</option>';
            examSelect.innerHTML = '<option value="">Select Exam</option>';
            classSelect.innerHTML = '<option value="">Select Class</option>';
            
            if (result.years) {
                result.years.forEach(yr => {
                    yearSelect.innerHTML += `<option value="${yr}">${yr}</option>`;
                });
            }
            if (result.exams) {
                result.exams.forEach(ex => {
                    examSelect.innerHTML += `<option value="${ex}">${ex}</option>`;
                });
            }
            if (result.classes) {
                result.classes.forEach(cls => {
                    classSelect.innerHTML += `<option value="${cls}">${cls}</option>`;
                });
            }
        } catch (e) {
            console.error("Error loading filters", e);
            alert("Error loading filters from Google Sheet.");
        }
    });

    function onAcademicYearChange() {
        document.getElementById('dynamicContainer').innerHTML = '';
        document.getElementById('submitBtn').style.display = 'none';
        if(document.getElementById('classSelect').value) {
            fetchStudents();
        }
    }

    function onExamTypeChange() {
        renderDynamicFields();
    }

    function onClassChange() {
        fetchStudents();
    }

    async function fetchStudents() {
        const year = document.getElementById('academicYear').value;
        const cls = document.getElementById('classSelect').value;
        const studentSelect = document.getElementById('studentSelect');

        if (!year || !cls) return;

        document.getElementById('loading').style.display = 'block';
        studentSelect.innerHTML = '<option value="">Select Student</option>';
        document.getElementById('dynamicContainer').innerHTML = '';
        document.getElementById('submitBtn').style.display = 'none';

        try {
            const response = await fetch(`${SCRIPT_URL}?action=getStudents&year=${year}&cls=${cls}`);
            studentsData = await response.json();
            
            if (studentsData.length === 0) {
                studentSelect.innerHTML = '<option value="">No students found</option>';
            } else {
                studentsData.forEach((st, index) => {
                    studentSelect.innerHTML += `<option value="${index}">${st.studentName}</option>`;
                });
            }
        } catch (e) {
            alert("Error fetching students.");
            console.error(e);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderDynamicFields() {
        const examType = document.getElementById('examType').value;
        const studentClassStr = document.getElementById('classSelect').value;
        const studentIndex = document.getElementById('studentSelect').value;
        const container = document.getElementById('dynamicContainer');
        const submitBtn = document.getElementById('submitBtn');

        if (!examType || !studentClassStr || studentIndex === "") {
            container.innerHTML = '';
            submitBtn.style.display = 'none';
            return;
        }

        submitBtn.style.display = 'block';

        let html = `
            <div class="section-title">Table 1: Attendance Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Maximum Working Days</label>
                    <input type="number" id="maxWorkingDays" required min="1">
                </div>
                <div class="form-group">
                    <label>Present Working Days</label>
                    <input type="number" id="presentDays" required min="0">
                </div>
            </div>
        `;

        let regularSubjects = [];
        let coCurricularSubjects = [];
        const isSA = examType.includes('SA');

        if (studentClassStr === '1' || studentClassStr === 'I' || studentClassStr === 'II' || studentClassStr === '2') {
            regularSubjects = ['Telugu', 'English', 'Maths'];
        } else {
            regularSubjects = ['Telugu', 'English', 'Maths', 'EVS'];
        }

        if (isSA) {
            coCurricularSubjects = ['HPE', 'WCE', 'VLE', 'ACE'];
        }

        html += `<div class="section-title">Table 2: Subject Marks (Max Marks: 50 - Fixed)</div>`;
        html += `<div class="subjects-container">`;

        html += `
            <div>
                <table>
                    <thead>
                        <tr>
                            <th>Curricular Subject</th>
                            <th>Max</th>
                            <th>Obtain (Max 50)</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        regularSubjects.forEach(sub => {
            let subKey = sub.toLowerCase();
            html += `
                <tr>
                    <td>${sub}</td>
                    <td><input type="text" value="50" id="${subKey}_max" readonly></td>
                    <td><input type="number" placeholder="0-50" id="${subKey}_obt" required min="0" max="50" oninput="validateMarks(this)"></td>
                </tr>
            `;
        });
        html += `</tbody></table></div>`;

        if (isSA && coCurricularSubjects.length > 0) {
            html += `
                <div>
                    <table>
                        <thead>
                            <tr>
                                <th>Co-Curricular Subject</th>
                                <th>Max</th>
                                <th>Obtain (Max 50)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            coCurricularSubjects.forEach(sub => {
                let subKey = sub.toLowerCase();
                html += `
                    <tr>
                        <td>${sub}</td>
                        <td><input type="text" value="50" id="${subKey}_max" readonly></td>
                        <td><input type="number" placeholder="0-50" id="${subKey}_obt" required min="0" max="50" oninput="validateMarks(this)"></td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
        }

        html += `</div>`;
        container.innerHTML = html;
    }

    function validateMarks(input) {
        let val = parseFloat(input.value);
        if (val > 50) {
            alert("Maximum marks for any subject is 50 only! Please enter 50 or below.");
            input.value = "";
            input.focus();
        } else if (val < 0) {
            input.value = "";
        }
    }

    document.getElementById('marksForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const maxWork = parseFloat(document.getElementById('maxWorkingDays').value);
        const presentWork = parseFloat(document.getElementById('presentDays').value);

        if (presentWork > maxWork) {
            alert("Error: Present Working Days cannot be greater than Maximum Working Days!");
            document.getElementById('presentDays').focus();
            return;
        }

        const academicYear = document.getElementById('academicYear').value;
        const examType = document.getElementById('examType').value;
        const studentClass = document.getElementById('classSelect').value;
        const studentIndex = document.getElementById('studentSelect').value;
        const selectedStudent = studentsData[studentIndex];

        let payload = {
            academicYear: academicYear,
            examType: examType,
            studentClass: studentClass,
            admmNo: selectedStudent.admmNo,
            studentName: selectedStudent.studentName.split(" (Adm:")[0], 
            fatherName: selectedStudent.fatherName,
            motherName: selectedStudent.motherName,
            maxWorkingDays: maxWork,
            presentDays: presentWork,
            
            teluguMax: document.getElementById('telugu_max') ? document.getElementById('telugu_max').value : "",
            teluguObt: document.getElementById('telugu_obt') ? document.getElementById('telugu_obt').value : "",
            englishMax: document.getElementById('english_max') ? document.getElementById('english_max').value : "",
            englishObt: document.getElementById('english_obt') ? document.getElementById('english_obt').value : "",
            mathsMax: document.getElementById('maths_max') ? document.getElementById('maths_max').value : "",
            mathsObt: document.getElementById('maths_obt') ? document.getElementById('maths_obt').value : "",
            
            evsMax: document.getElementById('evs_max') ? document.getElementById('evs_max').value : "",
            evsObt: document.getElementById('evs_obt') ? document.getElementById('evs_obt').value : "",
            
            hpeMax: document.getElementById('hpe_max') ? document.getElementById('hpe_max').value : "",
            hpeObt: document.getElementById('hpe_obt') ? document.getElementById('hpe_obt').value : "",
            wceMax: document.getElementById('wce_max') ? document.getElementById('wce_max').value : "",
            wceObt: document.getElementById('wce_obt') ? document.getElementById('wce_obt').value : "",
            vleMax: document.getElementById('vle_max') ? document.getElementById('vle_max').value : "",
            vleObt: document.getElementById('vle_obt') ? document.getElementById('vle_obt').value : "",
            aceMax: document.getElementById('ace_max') ? document.getElementById('ace_max').value : "",
            aceObt: document.getElementById('ace_obt') ? document.getElementById('ace_obt').value : "",
        };

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting Marks...";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            alert("Marks successfully submitted and saved to sheet!");
            
            document.getElementById('studentSelect').value = "";
            document.getElementById('dynamicContainer').innerHTML = '';
            submitBtn.style.display = 'none';
        } catch (err) {
            alert("Failed to submit marks.");
            console.error(err);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Marks";
        }
    });
</script>

</body>
</html>
